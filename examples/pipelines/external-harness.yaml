# External Coding-Agent Harness (OpenCode, Claude Code, Codex, Pi)
#
# Raw provider credentials (`OPENCODE_API_KEY`, `ANTHROPIC_API_KEY`,
# `OPENAI_API_KEY`, or custom provider keys) live in Kodema's control plane
# (`kodema secret set ...`) and are NEVER mounted into workload containers.
#
# Wrapping the harness with `kodema harness exec -- <cmd>` (built into
# `/kodema/bin/kodema`, on `PATH` in every container action) starts a local
# loopback LLM proxy that:
#   - Re-reads `/kodema/secrets/KODEMA_TOKEN` fresh on every request (survives
#     live controller token rotation during long coding sessions),
#   - Trusts `$KODEMA_CA_FILE` automatically (zero CA env-var boilerplate),
#   - Exports `OPENAI_BASE_URL`, `ANTHROPIC_BASE_URL`, `OPENCODE_BASE_URL`,
#     `*_API_KEY`, rewritten `KODEMA_LLM_<PROVIDER>_BASE_URL`, and default
#     OpenCode v2 `OPENCODE_CONFIG_CONTENT`,
#   - Enforces live token/USD budgets and attributes usage to `model_usage`.
#
# Swap `opencode run ...` for `claude -p ...`, `codex exec ...`, or `pi -p ...`
# without changing the pipeline contract. For custom tools that dial
# `$KODEMA_LLM_<PROVIDER>_BASE_URL` directly without `kodema harness exec`, read
# `/kodema/secrets/KODEMA_TOKEN` per request and trust `$KODEMA_CA_FILE`.
#
# Flow: prepare (container) -> harness (container, loopback LLM proxy)
# Run:  kodema pipeline apply examples/pipelines/external-harness.yaml
#       kodema task run --title "Implement feature" --pipeline external-harness
budget:
  max_tokens: 250000
  max_cost_usd: 5.0
actions:
  - name: prepare
    image: registry.example.com/kodema/base@sha256:cae662172fd450bb0cd710a769079c05bfc5d8e35efa6576edc7d0377afdd4a2
    timeout: 5m
    commands:
      - kodema-example prepare-workspace

  - name: harness
    image: registry.example.com/kodema/harness@sha256:49f756463ad9dcfb9b6ade54d7d6f15476e7214f46a65b4b0c55d46845b12f70
    timeout: 30m
    caches:
      - go-mod
      - go-build
    budget:
      max_tokens: 200000
      max_cost_usd: 4.0
    resources:
      memory: 4Gi
      cpu: "2"
    env:
      GOMODCACHE: /kodema/cache/go-mod
      GOCACHE: /kodema/cache/go-build
    commands:
      - kodema harness exec -- opencode run "Implement /kodema/task/spec.json and verify unit tests pass"
      - harness report
