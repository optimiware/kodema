# Delivery (Stage 3): Promote Digest-Pinned Image
#
# Writes a deploy-repository work-branch candidate referencing the forwarded
# immutable `image` digest, requests human approval (`role/reviewer`) bound to
# the exact `deploy-repo-1` resource, `refs/heads/deploy`, `expected_base`, and
# `candidate`, then integrates the approved protected update without rebuilding.
#
# Flow: release (container) -> approve (role/reviewer) -> integrate (container)
# Run:  kodema pipeline apply examples/pipelines/promote.yaml
#       kodema pipeline start promote \
#         --input image=registry.example.com/shop/web@sha256:<64-hex>
inputs:
  - image
actions:
  - name: release
    image: registry.example.com/kodema/release@sha256:a4d451ec23463726f72c43d64c710968f6b602cd653b4de8adee1b556240a829
    timeout: 10m
    outputs:
      - candidate
      - expected_base
    commands:
      - write-deploy-candidate "$(cat /kodema/inputs/image)"

  - name: approve
    request: role/reviewer
    timeout: 72h
    subject:
      operation: git.ref.update
      resource: deploy-repo-1
      ref: refs/heads/deploy
      expected_base:
        from: release.outputs.expected_base
      candidate:
        from: release.outputs.candidate
    outputs:
      - approved

  - name: integrate
    image: registry.example.com/kodema/integrate@sha256:ad9b338ab555c072a2131a946e8ed993cfcee4fe61c1f65efa37a1ce78ecfed5
    timeout: 10m
    commands:
      - integrate-protected-update "$(cat /kodema/outputs/release/candidate)"
