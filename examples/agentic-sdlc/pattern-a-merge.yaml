# Pattern A (Stage 3 of 3): Serialized Cross-Execution Merge via Decision ID
#
# Passes the immutable `decision_id` minted by Stage 2's `review` action to
# `service/merge-coordinator` (`kodema services --kind merge_coordinator`).
#
# The built-in `merge_coordinator` serializes pushes to `target_ref` and
# forwards `-o kodema.decision_id=<decision_id>`, refusing with base-moved if
# `target_ref` advanced past `base`. For clean rebases onto a moved target ref,
# `kodema git serve` supports `option approve-rebase.<ref> = disjoint` with
# `-o kodema.approved_base=<sha> -o kodema.approved_candidate=<sha>`
# (optionally paired with `-o kodema.decision_id=<id>`) for pushing executions
# or custom rebase-aware merge services.
#
# Keeping `completes_task: false` lets a post-merge step or orchestrator call
# `kodema task complete <task-id>` explicitly once release checks finish.
#
# Flow: merge (service/merge-coordinator, with decision_id) -> outputs.{base,candidate,output}
inputs:
  - repository
  - target_ref
  - base
  - candidate
  - decision_id
completes_task: false
actions:
  - name: merge
    request: service/merge-coordinator
    timeout: 1h
    subject:
      repository:
        from: inputs.repository
      ref:
        from: inputs.target_ref
      base:
        from: inputs.base
      candidate:
        from: inputs.candidate
      decision_id:
        from: inputs.decision_id
    outputs:
      - base
      - candidate
      - output
