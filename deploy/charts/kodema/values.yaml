# Kodema installation values.
#
# Every credential is referenced through an existing Kubernetes Secret. This
# file never carries a literal secret value, no template creates a Secret, and
# config.extraEnv below is restricted to non-secret optional variables: a
# credential-shaped name, a development token, a cloud credential or a value
# with URL userinfo is refused at render time (values.schema.json and
# templates/_extraenv.tpl).
# The control plane runs as one replica; tenant workloads live in their own
# namespaces behind default-deny network policies.

environment: "production"

image:
  repository: registry.example.com/kodema
  tag: "0.8.2"
  # Production requires the published manifest digest, also used by the workload
  # toolbox. In environment: "test", an empty digest falls back KODEMA_TOOLBOX_IMAGE
  # to repository:tag so the workload toolbox works out of the box.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  installationID: "kodema-stage"
  publicURL: "https://kodema.kodema-system.svc.cluster.local:8443"
  # Empty uses the per-tenant Service when gitService is enabled.
  workloadGitURL: ""
  # Retained for the descriptor baseline only: no chart template reads
  # databaseURL or natsURL. The server reads every database URL from the
  # kodema-database Secret keys (database_url, controller_url, publisher_url,
  # auth_url) and the broker URL from the kodema-broker Secret; the
  # full-verification TLS mode is delivered by scripts/bootstrap-secrets, not
  # by this value.
  databaseURL: "postgres://kodema_runtime@database:5432/kodema?sslmode=verify-full&sslrootcert=/etc/kodema/pg-ca/ca.crt"
  natsURL: "tls://nats:4222"
  keyAdapter: "scw-kms"
  keyReference: "scw-kms:fr-par/00000000-0000-0000-0000-000000000000"
  keyCurrentVersion: 1
  mcpPath: "/mcp"
  # Server environment, name to literal string. This is a narrow allowlist,
  # repeated in values.schema.json and templates/_extraenv.tpl:
  #
  # REQUIRED for environment: production and environment: test (the render
  # fails without them or with an empty value; cmd/kodema/production.go and
  # cmd/kodema/test_profile.go refuse to start):
  #   KODEMA_OIDC_ISSUER, KODEMA_OIDC_AUDIENCE, KODEMA_OIDC_JWKS_URL,
  #   KODEMA_OIDC_TENANT_CLAIM
  #
  # Every value that is present must be non-empty: an empty OIDC or discovery
  # value is a named configuration error, never a silent default.
  #
  # Optional:
  #   KODEMA_OIDC_{SUBJECT_CLAIM,PROJECT_CLAIM,CA_FILE}
  #                                            (cmd/kodema/production.go, test_profile.go)
  #   KODEMA_DISCOVERY_{ISSUER,CLIENT_ID,AUDIENCE,AUTHORIZATION_ENDPOINT,
  #                     TOKEN_ENDPOINT,DEVICE_AUTHORIZATION_ENDPOINT,
  #                     REVOCATION_ENDPOINT,SCOPES,API_URL}
  #                                            (cmd/kodema/server.go)
  #   KODEMA_TENANT_NAMESPACE                  (production.go singleton only:
  #                                            defaults to kodema-tenant-<tenant>;
  #                                            refused with more than one tenant)
  #   KODEMA_WORKLOAD_{CPU,MEMORY}_{REQUEST,LIMIT}, KODEMA_WORKLOAD_MAX_{CPU,MEMORY}_LIMIT
  #                                            (production.go runtime policy)
  #
  # A name the chart renders itself is refused (a duplicate env entry would
  # override the production composition), as are KODEMA_DEV_* development
  # tokens, SCW_/AWS_/GOOGLE_ cloud credentials and credential-shaped names
  # (except a mounted *_FILE path or public *_ENDPOINT URL). Values are literal
  # strings: objects (valueFrom) are refused, and so is a URL carrying
  # user:password@ userinfo. Never put a secret here; credentials come from
  # Secrets.
  extraEnv: {}
  workspacePVC:
    # Empty selects the cluster's default StorageClass (e.g. local-path on k3s).
    # Cloud overlays (such as deploy/scw with sbs-default) override this explicitly.
    storageClass: ""
    size: "10Gi"
    accessMode: "ReadWriteOnce"
  workloadCA:
    secretName: "kodema-workload-ca"
  # Workload secret-name allow-list rendered into KODEMA_SECRET_RULES_FILE.
  # Production stays fail-closed by default (no ConfigMap, no env var) and
  # refuses allowAll: true. In environment: "test", allowAllInTest: true
  # generates an allow_all rule for every declared tenant unless explicit rules
  # or existingConfigMap are provided (set allowAllInTest: false to stay
  # fail-closed in test). existingConfigMap and inline rules are mutually
  # exclusive.
  secretRules:
    existingConfigMap: ""
    key: "secret-rules.json"
    allowAllInTest: true
    rules: []
  # Streaming LLM proxy and configured model gateway rendered into
  # KODEMA_MODELS_FILE. Off by default (no ConfigMap, no env var). Never put
  # raw API keys here: secretName references Kodema's encrypted DB secrets.
  # Set defaultProviders: true to enable the built-in openai, anthropic, and
  # opencode providers for every declared tenant (explicit entries in providers
  # override matching built-ins). existingConfigMap is mutually exclusive with
  # inline settings. Production refuses http:// provider/model URLs.
  models:
    existingConfigMap: ""
    key: "models.json"
    defaultProviders: false
    providers: []
    models: []
    budgets: {}
    secretRules: []

secrets:
  database:
    existingSecret: kodema-database
  broker:
    existingSecret: kodema-broker
  # Key material Secret mounted read-only at /etc/kodema/keys:
  #   - KMS adapters (scw-kms, aws-kms, gcp-kms, vault-transit): must contain
  #     the KMS-wrapped KEK blob at /etc/kodema/keys/kek-v<version>.blob
  #     matching config.keyCurrentVersion (for example, key "kek-v1.blob").
  #   - keyfile (environment: test only): must contain the raw 32-byte KEK
  #     under key "kek-v1.key" (or "kek-v1.blob"), which the prepare-keyfile
  #     initContainer stages into a mode-0400 in-memory file at
  #     /etc/kodema/keyfile/kek-v1.key.
  keys:
    existingSecret: kodema-keys
  # The static KMS credential Secret, by config.keyAdapter:
  #   scw-kms        REQUIRED for environment: production. Reads SCW_SECRET_KEY
  #                  from this Secret.
  #   vault-transit  REQUIRED for environment: production. Reads VAULT_ADDR and
  #                  VAULT_TOKEN (plus optional VAULT_NAMESPACE, VAULT_CACERT)
  #                  from this Secret.
  #   aws-kms        not used. The pod authenticates with EKS IRSA: set
  #                  serviceAccount.annotations."eks.amazonaws.com/role-arn".
  #   gcp-kms        not used. The pod authenticates with GKE Workload Identity:
  #                  set serviceAccount.annotations."iam.gke.io/gcp-service-account".
  #   keyfile        not used (environment: test only; refused in production).
  # For aws-kms, gcp-kms and environment: test the chart renders no reference
  # to this Secret, so the value below is ignored and the Secret need not exist.
  kmsCredentials:
    existingSecret: kodema-kms-credentials
  tls:
    existingSecret: kodema-tls
  # Per-credential broker access. scripts/bootstrap-secrets creates this Secret
  # (kodema-nats-auth) before the first chart render; the control plane connects
  # with the bypass user and starts the authorization callout. The broker
  # receives the matching public issuer key; this Secret holds the account seed
  # and both bypass credentials and is never rendered inline. The reference is
  # always rendered, so a missing Secret fails the pod at start instead of
  # silently falling back to an unauthenticated broker connection.
  natsAuth:
    existingSecret: "kodema-nats-auth"
    # The broker account the callout grants bind to. It must equal the stack
    # chart's nats.auth.callout.account; the stack chart wires both from one
    # YAML anchor so they cannot drift.
    account: "KODEMA"

# The tenants this installation serves. Every entry gets its own namespace,
# RBAC role, network policy and Kubernetes runtime adapter, and the Deployment
# renders the whole list as KODEMA_TENANTS (a one-entry list keeps the
# singleton KODEMA_TENANT). Ids are lowercase DNS labels because the namespace
# is derived as kodema-tenant-<tenant>; duplicates and invalid ids are refused
# at render time.
tenants:
  - tenant-a

networkPolicy:
  defaultDeny: true
  permitKodema: true
  permitGit: true
  # Hosts tenant workloads may reach on 443 (Cilium FQDN policy), for example
  # ["registry.npmjs.org"]. Empty keeps workloads on cluster-internal traffic.
  # The policy needs the cilium.io/v2 CiliumNetworkPolicy CRD: setting a
  # non-empty egressFQDNs list on a cluster without Cilium fails render time
  # rather than silently leaving workloads blocked behind default-deny.
  # Cilium's DNS proxy must also be enabled (enable-l7-proxy) for the DNS rule
  # to work.
  #
  # k3s networking prerequisites:
  #   - Default k3s (flannel + kube-router NetworkPolicy): ensure the host has
  #     br_netfilter loaded and net.bridge.bridge-nf-call-iptables=1.
  #   - When FQDN egress allowlists are needed on k3s: start k3s with
  #     --flannel-backend=none --disable-network-policy and install Cilium with
  #     enable-l7-proxy enabled.
  egressFQDNs: []

securityContext:
  runAsNonRoot: true
  runAsUser: 65532

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

service:
  type: ClusterIP
  port: 8443
  targetPort: 8443

# The control plane's ServiceAccount. In production the aws-kms adapter needs
# the annotation eks.amazonaws.com/role-arn (EKS IRSA role) and the gcp-kms
# adapter iam.gke.io/gcp-service-account (GKE Workload Identity); the render
# fails without it while create is true. scripts/deploy sets it from the
# deployment descriptor. The cloud binding trusts exactly the ServiceAccount
# named kodema in the release namespace.
serviceAccount:
  create: true
  name: kodema
  annotations: {}

rbac:
  create: true

persistence:
  logs:
    enabled: true
    storageClass: ""
    size: 10Gi
    accessMode: ReadWriteOnce
    mountPath: /var/lib/kodema

probes:
  mode: httpGet
  livenessPath: /healthz
  readinessPath: /readyz
  timeoutSeconds: 10

# Optional per-tenant `kodema git serve` StatefulSets. Off by default: with
# gitService.enabled false the chart renders nothing new.
#
# Each entry deploys one independent Git service account companion in the
# release namespace, with its own PVC, ClusterIP Service, TLS-terminating
# sidecar, NetworkPolicy and repository-to-resource mappings. The tenant id is
# capped at 41 characters so kodema-git-<tenant> plus the StatefulSet
# controller-revision-hash label stays within 63 characters. The service
# credential and the TLS certificate are referenced from existing Secrets;
# this file never carries a credential value.
#
# The receive journal is /var/lib/kodema/git/journal and the served repositories
# are /var/lib/kodema/git/repos on the same PVC. They are siblings: `git serve`
# refuses a journal directory at or inside a served repository.
#
# When enabled, the control plane also mounts every tenant's served repository
# directory (repos/<tenant>, never the journal) read-write and sets
# KODEMA_GIT_STORAGE_ROOT. The retention loop then keeps one ref per commit
# named by a retained execution under refs/kodema/keep/<sha>, which smart HTTP
# hides from every advertisement. The control plane enumerates the tenant's
# repositories from storage on every sweep, so a newly provisioned repository
# needs no restart. On a single worker the RWO claim is shared directly; a
# multi-node cluster needs an RWX class or both pods on one node. Keep refs are
# written on the next retention sweep (once at startup, then daily), so do not
# run `git gc` on the repository PVC before that sweep after a rewinding push.
#
# The binary speaks smart HTTP; the pinned Caddy sidecar terminates TLS for the
# externally served listener. The repository PVC is mounted by the Git service
# and, for retained-commit keep refs, by the control plane's served-repository
# subpath; execution workloads never mount it. It carries
# helm.sh/resource-policy: keep so an uninstall or removed entry cannot delete
# the repositories and journal.
#
# Both this workload and the services entries mount the API CA from
# secrets.tls.existingSecret (key ca.crt) and set SSL_CERT_FILE to it. Only the
# Kodema API is called, so the system trust roots are deliberately replaced by
# the installation CA rather than appended to them.
gitService:
  enabled: false
  # Public API base URL the Git service calls. Empty uses config.publicURL.
  baseURL: ""
  # Optional client-facing Git HTTP base URL for HTTP repository provisioning
  # (supports {tenant}). Defaults to config.workloadGitURL or the per-tenant
  # ClusterIP Service URL.
  publicURL: ""
  # Optional enforcing service ID for repository bindings created via
  # repository.create (supports {tenant}; defaults to "git" in the server).
  serviceID: ""
  # Optional trusted origins for repository bindings created via
  # repository.create (each entry supports {tenant}). Empty defaults to the
  # deduplicated publicURL and workloadGitURL.
  trustedOrigins: []
  # TLS-terminating proxy image, pinned by digest. A tag can be repointed, so
  # the template refuses anything that is not repository@sha256:<64 hex>.
  tlsProxyImage: "docker.io/library/caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee"
  # Port the ClusterIP Service and the TLS sidecar expose. Must be unprivileged
  # (1024-65535) because both containers run as UID 65532. Port 8081 is
  # reserved for the plaintext smart-HTTP backend on the pod network and is
  # refused: both containers share the Pod network namespace, so the sidecar
  # would crash-loop on the taken socket.
  port: 8443
  # Complete per-tenant entries. Enabling gitService without at least one entry
  # is refused at render time, as is an entry missing any required block.
  tenants: []
  # Example:
  # tenants:
  #   - tenant: tenant-a
  #     # Optional static repository name to registered resource id mappings,
  #     # rendered as repeated git serve --resource flags. Omit or leave empty
  #     # when serving repositories dynamically from admin/conf/git.conf.
  #     repositories:
  #       - name: shop/web
  #         resource: resource-id
  #     # Service account credential, mounted read-only. The service
  #     # authenticates only through the public API with this credential.
  #     credential:
  #       existingSecret: kodema-git-tenant-a
  #       key: token
  #     # Optional bearer token Secret for HTTP repository provisioning
  #     # (`git serve --provision-token-file`). When set on one or more tenants,
  #     # the control plane mounts the Secret read-only and configures
  #     # KODEMA_GIT_ADMIN_URL / KODEMA_GIT_PROVISION_TOKEN_FILE / KODEMA_GIT_CA_FILE.
  #     provisionToken:
  #       existingSecret: kodema-git-provision-tenant-a
  #       key: token
  #     # kubernetes.io/tls Secret carrying tls.crt and tls.key.
  #     tls:
  #       existingSecret: kodema-tls
  #     storage:
  #       storageClass: ""
  #       size: 10Gi
  #       accessMode: ReadWriteOnce
  #     # The only pod sources permitted to reach the Git service. Each entry
  #     # becomes one NetworkPolicy ingress peer on the TLS port; podLabels
  #     # narrows the peer to those pods.
  #     clients:
  #       - namespace: kodema-tenant-tenant-a
  #         podLabels:
  #           kodema.dev/tenant: tenant-a

# Optional independent Userland service adapters (`kodema services`). Off by
# default: with services.enabled false the chart renders nothing new.
#
# Each entry runs one adapter kind in the release namespace with its own
# service credential from an existing Secret and a NetworkPolicy that allows
# egress only to the Kodema API and cluster DNS and denies all ingress: the
# adapter opens no listener and both probes are exec-based. The merge_coordinator
# kind is refused; the accepted kinds are webhook, email, timer
# and responder. A timer entry requires a positive duration schedule. An email
# entry may reference a mailbox credential Secret; the file is mounted
# read-only and exposed only through KODEMA_MAILBOX_CREDENTIAL_FILE.
services:
  enabled: false
  # Public API base URL the adapters call. Empty uses config.publicURL.
  baseURL: ""
  entries: []
  # Example:
  # entries:
  #   - name: responder
  #     kind: responder
  #     service: responder-svc
  #     tenant: tenant-a
  #     project: project-a
  #     credential:
  #       existingSecret: kodema-service-responder
  #       key: token
  #   - name: timer
  #     kind: timer
  #     service: timer-svc
  #     tenant: tenant-a
  #     project: project-a
  #     schedule: 30s
  #     credential:
  #       existingSecret: kodema-service-timer
  #       key: token
  #   - name: email
  #     kind: email
  #     service: email-svc
  #     tenant: tenant-a
  #     project: project-a
  #     credential:
  #       existingSecret: kodema-service-email
  #       key: token
  #     mailboxCredential:
  #       existingSecret: kodema-email-mailbox
  #       key: password

# Optional per-project OpenCode Brain service NetworkPolicies (Option 2:
# Brain/Hands split). Off by default: with opencodeBrain.enabled false the
# chart renders nothing new.
#
# Each entry scopes one project's Brain pod (matched by tenant, project, and
# app.kubernetes.io/component: opencode-brain) to reach ONLY ephemeral sandbox
# pods in kodema-tenant-<tenant> carrying the matching tenant, project, and
# kodema.dev/role: sandbox labels on the configured sandbox MCP port. The Brain
# pod denies all ingress so sandbox pods can never reach Brain session storage,
# and tenant default-deny keeps sandbox pods unable to reach each other.
opencodeBrain:
  enabled: false
  sandboxPort: 8090
  projects: []
  # Example:
  # projects:
  #   - name: project-a-brain
  #     tenant: tenant-a
  #     project: project-a
  #     # Optional namespace where the Brain pod runs (defaults to .Release.Namespace).
  #     namespace: ""
  #     # Optional per-project override for the sandbox MCP port (1024-65535).
  #     sandboxPort: 8090
