{{- $secretRulesJSON := include "kodema.secretRulesJSON" . | trim }}
{{- if $secretRulesJSON }}
{{- $sr := .Values.config.secretRules | default dict }}
{{- $key := $sr.key | default "secret-rules.json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kodema-secret-rules
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kodema
    app.kubernetes.io/component: control-plane
data:
  {{ $key }}: |
{{ $secretRulesJSON | indent 4 }}
{{- end }}
