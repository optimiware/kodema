{{- include "kodema.validateExtraEnv" . }}
{{- if and .Values.config (hasKey .Values.config "optionalCapabilities") }}
{{- fail "config.optionalCapabilities is unsupported and ignored by the chart; remove it from values" }}
{{- end }}
{{- $secretRulesJSON := include "kodema.secretRulesJSON" . | trim }}
{{- $sr := dict }}
{{- if and .Values.config (hasKey .Values.config "secretRules") (kindIs "map" .Values.config.secretRules) }}
{{- $sr = .Values.config.secretRules }}
{{- end }}
{{- $secretRulesExisting := toString ($sr.existingConfigMap | default "") }}
{{- $secretRulesKey := toString ($sr.key | default "secret-rules.json") }}
{{- $secretRulesConfigMap := "" }}
{{- if $secretRulesExisting }}
{{- $secretRulesConfigMap = $secretRulesExisting }}
{{- else if $secretRulesJSON }}
{{- $secretRulesConfigMap = "kodema-secret-rules" }}
{{- end }}
{{- $modelsJSON := include "kodema.modelsJSON" . | trim }}
{{- $modelsCfg := dict }}
{{- if and .Values.config (hasKey .Values.config "models") (kindIs "map" .Values.config.models) }}
{{- $modelsCfg = .Values.config.models }}
{{- end }}
{{- $modelsExisting := toString ($modelsCfg.existingConfigMap | default "") }}
{{- $modelsKey := toString ($modelsCfg.key | default "models.json") }}
{{- $modelsConfigMap := "" }}
{{- if $modelsExisting }}
{{- $modelsConfigMap = $modelsExisting }}
{{- else if $modelsJSON }}
{{- $modelsConfigMap = "kodema-models" }}
{{- end }}
{{- $git := .Values.gitService | default dict }}
{{- $gitPort := int ($git.port | default 8443) }}
{{- $gitDefaultURL := printf "https://kodema-git-{tenant}.%s.svc.cluster.local:%d" .Release.Namespace $gitPort }}
{{- $workloadGitURL := .Values.config.workloadGitURL | default $gitDefaultURL }}
{{- $gitProvisionTenants := list }}
{{- if and .Values.gitService .Values.gitService.enabled }}
{{- range $entry := .Values.gitService.tenants }}
{{- if and (hasKey $entry "provisionToken") (not (kindIs "invalid" $entry.provisionToken)) }}
{{- if not (kindIs "map" $entry.provisionToken) }}
{{- fail (printf "gitService tenant %q provisionToken must be an object with existingSecret and key" (toString $entry.tenant)) }}
{{- end }}
{{- if not (and (hasKey $entry.provisionToken "existingSecret") (kindIs "string" $entry.provisionToken.existingSecret) (ne $entry.provisionToken.existingSecret "")) }}
{{- fail (printf "gitService tenant %q provisionToken.existingSecret must be a non-empty Secret name" (toString $entry.tenant)) }}
{{- end }}
{{- if not (and (hasKey $entry.provisionToken "key") (kindIs "string" $entry.provisionToken.key) (ge (len $entry.provisionToken.key) 1) (le (len $entry.provisionToken.key) 253) (regexMatch "^[A-Za-z0-9._-]+$" $entry.provisionToken.key)) }}
{{- fail (printf "gitService tenant %q provisionToken.key must match ^[A-Za-z0-9._-]+$" (toString $entry.tenant)) }}
{{- end }}
{{- $gitProvisionTenants = append $gitProvisionTenants $entry }}
{{- end }}
{{- end }}
{{- end }}
{{- $hasGitProvision := gt (len $gitProvisionTenants) 0 }}
{{- if and $hasGitProvision (not (and .Values.secrets .Values.secrets.tls .Values.secrets.tls.existingSecret)) }}
{{- fail "gitService provisionToken requires secrets.tls.existingSecret so KODEMA_GIT_CA_FILE can trust the installation CA" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kodema
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kodema
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  # One controller owns the commit lane; Recreate prevents an old and a new
  # pod from overlapping during an upgrade. This Deployment must already be
  # Recreate: the API server owns the defaulted
  # spec.strategy.rollingUpdate, so `rollingUpdate: null` cannot
  # switch an existing RollingUpdate Deployment to Recreate through Helm
  # server-side apply. A cluster that still has it as RollingUpdate needs the
  # one-time operator remedy documented in deploy/README.md (delete the
  # Deployment before the upgrade).
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: kodema
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kodema
        app.kubernetes.io/component: control-plane
      {{- if or $secretRulesJSON $modelsJSON }}
      annotations:
        {{- if $secretRulesJSON }}
        checksum/secret-rules: {{ $secretRulesJSON | sha256sum | quote }}
        {{- end }}
        {{- if $modelsJSON }}
        checksum/models: {{ $modelsJSON | sha256sum | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ if .Values.serviceAccount }}{{ .Values.serviceAccount.name | default "kodema" }}{{ else }}kodema{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        fsGroup: {{ .Values.securityContext.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- $isTest := eq .Values.environment "test" }}
      {{- $isKeyfile := and $isTest (eq (.Values.config.keyAdapter | default "") "keyfile") }}
      {{- $hasGit := and .Values.gitService .Values.gitService.enabled }}
      {{- if or $isKeyfile $hasGit }}
      initContainers:
        {{- if $isKeyfile }}
        # keys.NewKeyfile refuses symlinks and group/world-readable files.
        # Kubernetes Secret mounts are symlinks owned by root:fsGroup, so this
        # initContainer stages the 32-byte key into a mode-0400 regular file on
        # a memory-backed emptyDir owned by the pod UID (65532).
        - name: prepare-keyfile
          image: {{ if .Values.image.digest }}"{{ .Values.image.repository }}@{{ .Values.image.digest }}"{{ else }}"{{ .Values.image.repository }}:{{ .Values.image.tag }}"{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077
              if [ -f /etc/kodema/keys/kek-v1.key ]; then
                src=/etc/kodema/keys/kek-v1.key
              elif [ -f /etc/kodema/keys/kek-v1.blob ]; then
                src=/etc/kodema/keys/kek-v1.blob
              else
                echo "missing kek-v1.key in kodema-keys Secret" >&2
                exit 1
              fi
              cp "$src" /etc/kodema/keyfile/kek-v1.key
              chmod 0400 /etc/kodema/keyfile/kek-v1.key
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: keys
              mountPath: /etc/kodema/keys
              readOnly: true
            - name: keyfile
              mountPath: /etc/kodema/keyfile
        {{- end }}
        {{- if and .Values.gitService .Values.gitService.enabled }}
        # The server mounts each Git PVC through a subPath. A freshly provisioned
        # claim has no directories yet, and a missing subPath makes the whole Pod
        # fail to start, so this init container creates them before the server
        # container starts. It is idempotent and touches only
        # <claim>/repos/<tenant>, exactly the directory `git serve` serves.
        - name: prepare-git-repos
          image: {{ if .Values.image.digest }}"{{ .Values.image.repository }}@{{ .Values.image.digest }}"{{ else }}"{{ .Values.image.repository }}:{{ .Values.image.tag }}"{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              {{- range $entry := .Values.gitService.tenants }}
              mkdir -p "/data/{{ $entry.tenant }}/repos/{{ $entry.tenant }}"
              {{- end }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            {{- range $entry := .Values.gitService.tenants }}
            - name: git-repos-{{ $entry.tenant }}
              mountPath: /data/{{ $entry.tenant }}
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: kodema
          image: {{ if .Values.image.digest }}"{{ .Values.image.repository }}@{{ .Values.image.digest }}"{{ else }}"{{ .Values.image.repository }}:{{ .Values.image.tag }}"{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --profile={{ .Values.environment }}
            - --address=0.0.0.0:{{ if .Values.service }}{{ .Values.service.targetPort | default 8443 }}{{ else }}8443{{ end }}
            - --data-dir={{ if and .Values.persistence .Values.persistence.logs }}{{ .Values.persistence.logs.mountPath | default "/var/lib/kodema" }}{{ else }}/var/lib/kodema{{ end }}
            - --public-url={{ .Values.config.publicURL }}
          env:
            - name: KODEMA_PROFILE
              value: {{ .Values.environment | quote }}
            {{- if $isTest }}
            - name: KODEMA_RUNTIME
              value: "kubernetes"
            {{- end }}
            - name: KODEMA_INSTALLATION_ID
              value: {{ .Values.config.installationID | default "kodema-stage" | quote }}
            - name: KODEMA_PUBLIC_URL
              value: {{ .Values.config.publicURL | quote }}
            - name: KODEMA_TOOLBOX_IMAGE
              value: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else if $isTest }}{{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}{{ else }}""{{ end }}
            {{- if or .Values.config.workloadGitURL $git.enabled }}
            - name: KODEMA_WORKLOAD_GIT_URL
              value: {{ $workloadGitURL | quote }}
            {{- end }}
            - name: KODEMA_MCP_PATH
              value: {{ .Values.config.mcpPath | default "/mcp" | quote }}
            - name: KODEMA_DATA_DIR
              value: {{ if and .Values.persistence .Values.persistence.logs }}{{ .Values.persistence.logs.mountPath | default "/var/lib/kodema" | quote }}{{ else }}"/var/lib/kodema"{{ end }}
            - name: KODEMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret }}
                  key: database_url
            - name: KODEMA_CONTROLLER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret }}
                  key: controller_url
            - name: KODEMA_PUBLISHER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret }}
                  key: publisher_url
            - name: KODEMA_AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret }}
                  key: auth_url
            - name: KODEMA_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.broker.existingSecret }}
                  key: nats_url
            - name: KODEMA_NATS_CA_FILE
              value: "/etc/kodema/broker-tls/ca.crt"
            - name: KODEMA_NATS_CERT_FILE
              value: "/etc/kodema/broker-tls/tls.crt"
            - name: KODEMA_NATS_KEY_FILE
              value: "/etc/kodema/broker-tls/tls.key"
            {{- if .Values.secrets.natsAuth.existingSecret }}
            - name: KODEMA_NATS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.natsAuth.existingSecret }}
                  key: shell-user
            - name: KODEMA_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.natsAuth.existingSecret }}
                  key: shell-password
            - name: KODEMA_NATS_CALLOUT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.natsAuth.existingSecret }}
                  key: callout-user
            - name: KODEMA_NATS_CALLOUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.natsAuth.existingSecret }}
                  key: callout-password
            - name: KODEMA_NATS_CALLOUT_ISSUER_SEED
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.natsAuth.existingSecret }}
                  key: issuer.seed
            - name: KODEMA_NATS_CALLOUT_ACCOUNT
              value: {{ .Values.secrets.natsAuth.account | quote }}
            {{- end }}
            - name: KODEMA_KEY_ADAPTER
              value: {{ .Values.config.keyAdapter | quote }}
            - name: KODEMA_KEY_REF
              value: {{ .Values.config.keyReference | quote }}
            - name: KODEMA_KEY_CURRENT_VERSION
              value: {{ .Values.config.keyCurrentVersion | default 1 | quote }}
            - name: KODEMA_KEY_BLOBS_DIR
              value: "/etc/kodema/keys"
            {{- if $isKeyfile }}
            - name: KODEMA_KEYFILE
              value: "/etc/kodema/keyfile/kek-v1.key"
            {{- end }}
            - name: KODEMA_TLS_DIR
              value: "/etc/kodema/tls"
            # The tenant configuration comes from the chart's tenant list. A
            # multi-tenant installation serves every listed tenant through
            # KODEMA_TENANTS; the singleton form keeps KODEMA_TENANT for
            # compatibility. The server refuses a namespace override next to a
            # multi-tenant list, so the chart refuses it first.
            {{- if gt (len .Values.tenants) 1 }}
            - name: KODEMA_TENANTS
              value: {{ .Values.tenants | toJson | quote }}
            {{- else }}
            - name: KODEMA_TENANT
              value: {{ index .Values.tenants 0 | quote }}
            {{- end }}
            {{- range $name, $value := .Values.config.extraEnv }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.config.workspacePVC }}
            - name: KODEMA_WORKSPACE_PVC_STORAGE_CLASS
              value: {{ .Values.config.workspacePVC.storageClass | quote }}
            - name: KODEMA_WORKSPACE_PVC_SIZE
              value: {{ .Values.config.workspacePVC.size | quote }}
            - name: KODEMA_WORKSPACE_PVC_ACCESS_MODE
              value: {{ .Values.config.workspacePVC.accessMode | default "ReadWriteOnce" | quote }}
            {{- end }}
            {{- if .Values.config.workloadCA }}
            - name: KODEMA_WORKLOAD_CA_SECRET
              value: {{ .Values.config.workloadCA.secretName | quote }}
            {{- end }}
            {{- if $secretRulesConfigMap }}
            - name: KODEMA_SECRET_RULES_FILE
              value: {{ printf "/etc/kodema/secret-rules/%s" $secretRulesKey | quote }}
            {{- end }}
            {{- if $modelsConfigMap }}
            - name: KODEMA_MODELS_FILE
              value: {{ printf "/etc/kodema/models/%s" $modelsKey | quote }}
            {{- end }}
            # Retained-commit keep refs. Every Git tenant PVC is mounted
            # under one root; the keeper enumerates each tenant's bare
            # repositories from storage on every sweep, so a new repository
            # needs no restart and no static list. This is only meaningful when
            # the chart also deploys the Git service and its repository PVC.
            {{- if and .Values.gitService .Values.gitService.enabled }}
            - name: KODEMA_GIT_STORAGE_ROOT
              value: "/var/lib/kodema/git-repos"
            {{- end }}
            {{- if $hasGitProvision }}
            {{- $gitPublicURL := $git.publicURL | default .Values.config.workloadGitURL | default $gitDefaultURL }}
            {{- $gitTrustedOrigins := list }}
            {{- if $git.trustedOrigins }}
            {{- range $origin := $git.trustedOrigins }}
            {{- $gitTrustedOrigins = append $gitTrustedOrigins (toString $origin) }}
            {{- end }}
            {{- else }}
            {{- $gitTrustedOrigins = append $gitTrustedOrigins $gitPublicURL }}
            {{- if ne $workloadGitURL $gitPublicURL }}
            {{- $gitTrustedOrigins = append $gitTrustedOrigins $workloadGitURL }}
            {{- end }}
            {{- end }}
            - name: KODEMA_GIT_ADMIN_URL
              value: {{ $gitDefaultURL | quote }}
            - name: KODEMA_GIT_PROVISION_TOKEN_FILE
              value: "/etc/kodema/git-provision/{tenant}/token"
            - name: KODEMA_GIT_CA_FILE
              value: "/etc/kodema/tls/ca.crt"
            - name: KODEMA_GIT_PUBLIC_URL
              value: {{ $gitPublicURL | quote }}
            - name: KODEMA_GIT_TRUSTED_ORIGINS
              value: {{ join "," $gitTrustedOrigins | quote }}
            {{- if $git.serviceID }}
            - name: KODEMA_GIT_SERVICE_ID
              value: {{ $git.serviceID | quote }}
            {{- end }}
            {{- end }}
          # A static cloud KMS credential lives in its own Secret, apart from
          # the binary KEK blobs in the keys Secret (a blob cannot be an env var
          # and rotating a credential must never touch the KEK). Production
          # with the scw-kms adapter reads SCW_SECRET_KEY from it, so the
          # reference is required there; it is optional only for a development
          # or test profile. Production with aws-kms (EKS IRSA) or gcp-kms (GKE
          # Workload Identity) has no static credential: the pod authenticates
          # through its annotated ServiceAccount, and no reference to the
          # Secret is rendered, so a missing Secret cannot block the pod and a
          # present one cannot reach it. A development or test profile that
          # names no Secret renders no reference either.
          {{- $production := eq .Values.environment "production" }}
          {{- $workloadIdentity := and $production (has .Values.config.keyAdapter (list "aws-kms" "gcp-kms")) }}
          {{- if and $production (not $workloadIdentity) }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.kmsCredentials.existingSecret }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
          ports:
            - name: https
              containerPort: {{ if .Values.service }}{{ .Values.service.targetPort | default 8443 }}{{ else }}8443{{ end }}
              protocol: TCP
          {{- $probes := .Values.probes | default dict }}
          {{- if ne ($probes.mode | default "httpGet") "httpGet" }}
          {{- fail "probes.mode must be httpGet: a TCP probe cannot observe process liveness or dependency readiness" }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $probes.livenessPath | default "/healthz" }}
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: {{ $probes.timeoutSeconds | default 10 }}
          readinessProbe:
            httpGet:
              path: {{ $probes.readinessPath | default "/readyz" }}
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: {{ $probes.timeoutSeconds | default 10 }}
          volumeMounts:
            - name: retained-logs
              mountPath: {{ if and .Values.persistence .Values.persistence.logs }}{{ .Values.persistence.logs.mountPath | default "/var/lib/kodema" }}{{ else }}/var/lib/kodema{{ end }}
            - name: keys
              mountPath: /etc/kodema/keys
              readOnly: true
            {{- if $isKeyfile }}
            - name: keyfile
              mountPath: /etc/kodema/keyfile
              readOnly: true
            {{- end }}
            - name: database-ca
              mountPath: /etc/kodema/pg-ca
              readOnly: true
            - name: broker-tls
              mountPath: /etc/kodema/broker-tls
              readOnly: true
            {{- if .Values.secrets.tls }}
            - name: tls
              mountPath: /etc/kodema/tls
              readOnly: true
            {{- end }}
            {{- if $secretRulesConfigMap }}
            - name: secret-rules
              mountPath: /etc/kodema/secret-rules
              readOnly: true
            {{- end }}
            {{- if $modelsConfigMap }}
            - name: models
              mountPath: /etc/kodema/models
              readOnly: true
            {{- end }}
            {{- if and .Values.gitService .Values.gitService.enabled }}
            {{- range $entry := .Values.gitService.tenants }}
            # Only the tenant's served repository directory, never the receive
            # journal, is visible to the control plane.
            - name: git-repos-{{ $entry.tenant }}
              mountPath: /var/lib/kodema/git-repos/{{ $entry.tenant }}
              subPath: repos/{{ $entry.tenant }}
            {{- end }}
            {{- range $entry := $gitProvisionTenants }}
            - name: git-provision-{{ $entry.tenant }}
              mountPath: /etc/kodema/git-provision/{{ $entry.tenant }}
              readOnly: true
            {{- end }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: retained-logs
          {{- if and .Values.persistence .Values.persistence.logs .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            claimName: kodema-retained-logs
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: keys
          secret:
            secretName: {{ .Values.secrets.keys.existingSecret }}
        {{- if $isKeyfile }}
        - name: keyfile
          emptyDir:
            medium: Memory
        {{- end }}
        - name: database-ca
          secret:
            secretName: {{ .Values.secrets.database.existingSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        - name: broker-tls
          secret:
            secretName: {{ .Values.secrets.broker.existingSecret }}
        {{- if .Values.secrets.tls }}
        - name: tls
          secret:
            secretName: {{ .Values.secrets.tls.existingSecret }}
        {{- end }}
        {{- if $secretRulesConfigMap }}
        - name: secret-rules
          configMap:
            name: {{ $secretRulesConfigMap | quote }}
        {{- end }}
        {{- if $modelsConfigMap }}
        - name: models
          configMap:
            name: {{ $modelsConfigMap | quote }}
        {{- end }}
        {{- if and .Values.gitService .Values.gitService.enabled }}
        {{- range $entry := .Values.gitService.tenants }}
        # RWO on a single-worker stage lets the control plane and the tenant's
        # Git StatefulSet share the claim. A multi-node cluster needs an RWX
        # class or both pods pinned to one node; see
        # docs/runbooks/production-deployment.md.
        - name: git-repos-{{ $entry.tenant }}
          persistentVolumeClaim:
            claimName: kodema-git-{{ $entry.tenant }}-data
        {{- end }}
        {{- range $entry := $gitProvisionTenants }}
        - name: git-provision-{{ $entry.tenant }}
          secret:
            secretName: {{ $entry.provisionToken.existingSecret | quote }}
            items:
              - key: {{ $entry.provisionToken.key | quote }}
                path: token
        {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
