name: Release

# Publishes Kodema releases from master: the multi-arch kodema image and both
# Helm charts to GHCR, and a GitHub release with the kodema archives, the chart
# packages and SHA256SUMS. The workflow creates the tag v<VERSION> itself.
#
# - Manual minor, major, and pre-release releases: prepare VERSION, charts,
#   docs and CHANGELOG.md with `make release-prepare VERSION=<version>` and
#   merge the release commit to master.
# - Automatic patch releases: any merge to master that leaves a released
#   MAJOR.MINOR.PATCH VERSION unchanged publishes MAJOR.MINOR.(max_patch + 1)
#   directly on that commit, with no release commit.
# - Development versions (*-dev*) and manual runs with publish=false publish
#   nothing. A released version or commit is never replaced.
# See docs/runbooks/release.md.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the resolved version from master; off rehearses the build without publishing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # The packages live under the repository name: ghcr.io/<owner>/kodema
      # belongs to the archived v1 repository and this workflow cannot write it.
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/kodema
      CHART_REGISTRY: oci://ghcr.io/${{ github.repository }}/charts
      GH_TOKEN: ${{ github.token }}
      PUBLISH_INPUT: ${{ inputs.publish }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      # Sets VERSION, BASE_VERSION, PREVIOUS_VERSION, RELEASE_MODE, PUBLISH,
      # PRERELEASE and RUN_BUILD for the steps below.
      - name: Resolve the version
        run: |
          args=(--commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY")
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "::error::a version is published from master, not from ${GITHUB_REF}"
              exit 1
            fi
            args+=(--publish)
            if [[ -n "$PUSH_BEFORE" ]]; then
              args+=(--before "$PUSH_BEFORE")
            fi
          elif [[ "$PUBLISH_INPUT" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "::error::a version is published from master, not from ${GITHUB_REF}"
              exit 1
            fi
            args+=(--explicit-publish)
          fi
          resolved="$(scripts/release-version "${args[@]}")"
          while IFS='=' read -r key value; do
            case "$key" in
              VERSION|BASE_VERSION|PREVIOUS_VERSION|RELEASE_MODE|PUBLISH|PRERELEASE)
                printf '%s=%s\n' "$key" "$value" >>"$GITHUB_ENV"
                printf -v "$key" '%s' "$value"
                ;;
              *)
                echo "::error::unexpected output from scripts/release-version: ${key}"
                exit 1
                ;;
            esac
          done <<<"$resolved"
          run_build=false
          if [[ "$PUBLISH" == "true" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            run_build=true
          fi
          echo "RUN_BUILD=${run_build}" >>"$GITHUB_ENV"
          case "$RELEASE_MODE" in
            dev)
              echo "::notice::${VERSION} is a development version: skipping publication"
              ;;
            prerelease-unchanged)
              echo "::notice::VERSION is unchanged pre-release ${VERSION}: skipping automatic patch release"
              ;;
            patch)
              echo "::notice::Automatic patch release ${VERSION} (over ${BASE_VERSION}, previous ${PREVIOUS_VERSION}); publish=${PUBLISH}"
              ;;
            manual)
              echo "::notice::Manual release ${VERSION}; publish=${PUBLISH}, prerelease=${PRERELEASE}"
              ;;
          esac
          echo "version ${VERSION}, mode ${RELEASE_MODE}, publish ${PUBLISH}, prerelease ${PRERELEASE}, run_build ${run_build}"

      - name: Enable multi-arch container runtime support
        if: env.RUN_BUILD == 'true'
        run: |
          sudo apt-get update
          # qemu-user-binfmt registers the emulators the arm64 image stage runs
          # under; socat serves the installation check's TLS front ends.
          sudo apt-get install -y --no-install-recommends qemu-user-binfmt socat

      - name: Build the release artifacts
        if: env.RUN_BUILD == 'true'
        run: |
          rm -rf dist
          scripts/dist --version "$VERSION"

      - name: Build the image
        if: env.RUN_BUILD == 'true'
        run: |
          ref="$(scripts/image build --repository "$IMAGE_REPOSITORY" --tag "$VERSION" --version "$VERSION")"
          line="$(podman run --rm "$ref" version)"
          echo "$line"
          [[ "$line" == "kodema ${VERSION} (revision ${GITHUB_SHA},"* ]] || { echo "::error::the image reports another version or revision"; exit 1; }
          if [[ "$PUBLISH" != "true" ]]; then
            scripts/image build --repository "$IMAGE_REPOSITORY" --tag "${VERSION}-multiarch" --version "$VERSION" --platforms linux/amd64,linux/arm64
          fi

      # The gate before anything is pushed: the image must install with the
      # Podman bundle and run a pipeline.
      - name: Install the image and run a pipeline
        if: env.RUN_BUILD == 'true'
        run: |
          socket="${RUNNER_TEMP}/podman.sock"
          podman system service --time=0 "unix://${socket}" &
          service=$!
          trap 'kill "$service" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            [[ -S "$socket" ]] && break
            sleep 1
          done
          KODEMA_LOCAL_PODMAN_SOCKET="$socket" scripts/release-smoke --image "${IMAGE_REPOSITORY}:${VERSION}"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        run: |
          printf '%s' "$GH_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the image
        if: env.PUBLISH == 'true'
        run: |
          extra_args=(--platforms linux/amd64,linux/arm64)
          if [[ "$PRERELEASE" == "false" ]]; then
            extra_args+=(--also-tag latest)
          fi
          reference="$(scripts/image build-push --repository "$IMAGE_REPOSITORY" --tag "$VERSION" --version "$VERSION" "${extra_args[@]}")"
          echo "IMAGE_REFERENCE=${reference}" >>"$GITHUB_ENV"
          echo "pushed ${reference}"

      - name: Push the charts
        if: env.PUBLISH == 'true'
        run: |
          helm push "dist/kodema-${VERSION}.tgz" "$CHART_REGISTRY"
          helm push "dist/kodema-stack-${VERSION}.tgz" "$CHART_REGISTRY"

      - name: Publish the GitHub release
        if: env.PUBLISH == 'true'
        run: |
          image_tags="tag \`${VERSION}\`"
          if [[ "$PRERELEASE" == "false" ]]; then
            image_tags="tags \`${VERSION}\`, \`latest\`"
          fi
          {
            if [[ "$RELEASE_MODE" == "patch" ]]; then
              echo "## Changes"
              echo
              prev_tag=""
              if [[ -n "$PREVIOUS_VERSION" ]]; then
                if ! git rev-parse --verify -q "refs/tags/v${PREVIOUS_VERSION}^{commit}" >/dev/null; then
                  git fetch --no-tags origin "refs/tags/v${PREVIOUS_VERSION}:refs/tags/v${PREVIOUS_VERSION}" >/dev/null 2>&1 || true
                fi
                if git rev-parse --verify -q "refs/tags/v${PREVIOUS_VERSION}^{commit}" >/dev/null; then
                  prev_tag="v${PREVIOUS_VERSION}"
                fi
              fi
              changes=""
              if [[ -n "$prev_tag" ]]; then
                changes="$(git log --first-parent --format='- %s (%h)' "${prev_tag}..${GITHUB_SHA}")"
              fi
              if [[ -z "$changes" ]]; then
                changes="$(git log -1 --format='- %s (%h)' "$GITHUB_SHA")"
              fi
              printf '%s\n\n' "$changes"
            fi
            echo "## Artifacts"
            echo
            echo "| Artifact | Reference |"
            echo "|---|---|"
            echo "| Image (\`linux/amd64\`, \`linux/arm64\`) | \`${IMAGE_REFERENCE}\` (${image_tags}) |"
            echo "| Chart \`kodema\` | \`${CHART_REGISTRY}/kodema\` version \`${VERSION}\` |"
            echo "| Chart \`kodema-stack\` | \`${CHART_REGISTRY}/kodema-stack\` version \`${VERSION}\` |"
            echo "| \`kodema\` | the archives below; verify with \`sha256sum --check SHA256SUMS\` |"
            echo
            if [[ "$RELEASE_MODE" == "patch" ]]; then
              compare=""
              if [[ -n "$PREVIOUS_VERSION" ]]; then
                compare=" Full diff: [v${PREVIOUS_VERSION}...v${VERSION}](https://github.com/${GITHUB_REPOSITORY}/compare/v${PREVIOUS_VERSION}...v${VERSION})."
              fi
              echo "Source revision: \`${GITHUB_SHA}\` (automatic patch release over \`${BASE_VERSION}\`).${compare} Minor and major release history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)."
            else
              echo "Source revision: \`${GITHUB_SHA}\`. Changes and known limitations: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)."
            fi
          } >"${RUNNER_TEMP}/notes.md"
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          # Creates the tag v<VERSION> on this commit when it does not exist.
          gh release create "v${VERSION}" dist/* --target "$GITHUB_SHA" \
            --title "Kodema ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" "${flags[@]}"
